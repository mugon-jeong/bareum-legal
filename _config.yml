title: 바름(BAREUM)
description: 가진 화장품의 바르는 순서와 성분 관계를 알아보고 매일의 루틴을 기록하는 iOS 앱
app_store_url: ""
theme: jekyll-theme-minimal
lang: ko-KR
exclude:
  - README.md
  - THEME-LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - wrangler.jsonc
  - _config.cloudflare.yml
  - node_modules
  - vendor
  - scripts
  - docs
defaults:
  - scope:
      path: ""
    values:
      layout: default
