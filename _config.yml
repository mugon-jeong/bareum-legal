title: 바름(BAREUM)
description: 피부 고민과 가진 화장품의 성분으로 루틴을 구성하고 바르는 순서를 확인하는 iOS 앱
app_store_url: "https://apps.apple.com/kr/app/id6807600225"
theme: jekyll-theme-minimal
lang: ko-KR
exclude:
  - README.md
  - THEME-LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - wrangler.jsonc
  - _config.cloudflare.yml
  - node_modules
  - vendor
  - scripts
  - docs
defaults:
  - scope:
      path: ""
    values:
      layout: default
