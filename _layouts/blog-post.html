---
layout: blog
---
<article class="blog-article">
  <nav class="blog-crumbs" aria-label="위치"><a href="{{ '/blog/' | relative_url }}">성분 이야기</a> <span aria-hidden="true">›</span> 읽을거리</nav>
  <h1>{{ page.title }}</h1>
  <p class="blog-inci"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  <div class="blog-post-body">
{{ content }}
  </div>
  {% include blog-cta.html campaign=page.campaign %}
</article>
